<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE COLONY — Endless Stream Mint</title>
  <style>
    :root {
      --bg: #05070c;
      --card-bg: rgba(15, 20, 32, 0.85);
      --accent: #00f0ff;
      --gold: #ffd700;
      --pink: #ff007f;
      --purple: #a855f7;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Ambient background lighting */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      z-index: 10;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      background: rgba(5, 7, 12, 0.6);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-bar {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.05em;
    }

    .stat-val {
      font-weight: 800;
      font-family: monospace;
      font-size: 1.1rem;
    }

    .gold-text {
      color: var(--gold);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    main {
      z-index: 1;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1rem;
      padding: 1rem;
      height: calc(100vh - 70px);
      box-sizing: border-box;
    }

    @media (max-width: 850px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
      .sidebar {
        height: 220px;
      }
    }

    /* Fall Stream Stage */
    .field-container {
      position: relative;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
    }

    canvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    /* Overlay Floating Stream Controls */
    .stream-overlay {
      position: absolute;
      top: 1rem;
      left: 1rem;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .combo-badge {
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--pink);
      text-shadow: 0 0 8px var(--pink);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .combo-badge.active {
      opacity: 1;
    }

    /* Incubator Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .incubator-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: space-between;
      backdrop-filter: blur(12px);
    }

    .progress-box {
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--purple), var(--gold));
      box-shadow: 0 0 12px var(--accent);
      transition: width 0.15s ease-out;
    }

    .creature-viewport {
      width: 200px;
      height: 200px;
      position: relative;
      background: radial-gradient(circle, rgba(255,255,255,0.04) 0%, transparent 70%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .creature-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.3));
    }

    .dna-log {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 120px;
      overflow-y: auto;
    }

    .dna-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      padding: 0.35rem 0.5rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      border-left: 3px solid var(--accent);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 2rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.9);
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 0.4rem;
    }

    .modal-subtitle {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
    }

    .card-preview {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: center;
    }

    .btn {
      width: 100%;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      border: none;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #ffaa00);
      color: #000;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
    }

    .btn-secondary {
      background: transparent;
      color: #64748b;
      margin-top: 0.5rem;
    }

    .btn-secondary:hover { color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-title">The Colony</div>
    </div>
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Cores Left</span>
        <span class="stat-val gold-text" id="cores-count">1,842</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Popped</span>
        <span class="stat-val" id="popped-count">0</span>
      </div>
    </div>
  </header>

  <main>
    <div class="field-container">
      <div class="stream-overlay">
        <div class="combo-badge" id="comboBadge">5x COMBO SPREE!</div>
      </div>
      <canvas id="fieldCanvas"></canvas>
    </div>

    <div class="sidebar">
      <div class="incubator-card">
        <div class="progress-box">
          <div class="progress-header">
            <span>Mint Target Synthesis</span>
            <span id="targetText">0 / 0</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <div class="creature-viewport">
          <svg class="creature-svg" id="creatureSvg" viewBox="0 0 200 200"></svg>
        </div>

        <div class="dna-log" id="dnaLog">
          <div class="dna-item">
            <span>Stream Status</span>
            <span style="color: var(--accent);">Active Flow</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- MINT READY MODAL -->
  <div class="modal-overlay" id="winModal">
    <div class="modal-box">
      <div class="modal-title gold-text">CREATURE SYNTHESIZED!</div>
      <div class="modal-subtitle">Target pops reached. Your custom specimen has fully formed and is ready to mint.</div>
      <div class="card-preview" id="winPreview"></div>
      <button class="btn btn-primary" onclick="alert('Mint Contract Triggered!')">MINT NOW (LIVE)</button>
      <button class="btn btn-secondary" onclick="resetStream()">Continue Streaming</button>
    </div>
  </div>

  <script>
    // --- AUDIO SYNTHESIS ENGINE ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }

      playPop(combo = 1) {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        const pitch = Math.min(800, 280 + (combo * 20) + Math.random() * 80);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.07);

        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.07);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.07);
      }

      playGoldPop() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          setTimeout(() => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
          }, i * 50);
        });
      }
    }

    const audio = new SoundEngine();

    // --- GAME ENGINE STATE ---
    // Dynamic random target from 60 to 150
    let mintTarget = Math.floor(Math.random() * (150 - 60 + 1)) + 60;
    let totalPopped = 0;
    let comboCount = 0;
    let comboTimer = null;
    let coresRemaining = 1842;

    // Expanded DNA pipeline to support > 10,000 unique trait permutations
    let creatureDNA = {
      hue: 180,
      secondaryHue: 240,
      bodyShape: 'circle', // circle, rect, blob, star, oval
      texturePattern: 'none', // dots, stripes, rings
      eyes: 0,
      eyeStyle: 'classic', // classic, cyclops, anime, alien, cute
      limbs: 0,
      limbType: 'tentacle', // tentacle, antenna, feet
      ears: 'none', // bunny, cat, pointed, horns
      mouth: 'none', // smile, fang, surprised, cute
      aura: false,
      crown: false
    };

    const canvas = document.getElementById('fieldCanvas');
    const ctx = canvas.getContext('2d');
    const poppedDisplay = document.getElementById('popped-count');
    const progressFill = document.getElementById('progressFill');
    const targetText = document.getElementById('targetText');
    const comboBadge = document.getElementById('comboBadge');
    const dnaLog = document.getElementById('dnaLog');
    const creatureSvg = document.getElementById('creatureSvg');
    const winModal = document.getElementById('winModal');

    // --- FALLING BUBBLE STREAM ENGINE ---
    let bubbles = [];
    let particles = [];
    let isPointerDown = false;
    let lastPointerPos = { x: 0, y: 0 };

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }

    class FallingBubble {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.radius = Math.random() * 18 + 18;
        this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
        this.y = initial ? Math.random() * canvas.height : -this.radius * 2;
        this.speedY = Math.random() * 2.5 + 1.5;
        this.driftFreq = Math.random() * 0.03 + 0.01;
        this.driftAmp = Math.random() * 1.5 + 0.5;
        this.popped = false;
        
        this.type = Math.random() < 0.05 ? 'gold' : 'standard';
        if (this.type === 'gold') {
          this.speedY *= 1.4;
        }
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * this.driftFreq) * this.driftAmp;

        if (this.y - this.radius > canvas.height) {
          this.reset(false);
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        const grad = ctx.createRadialGradient(
          -this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1,
          0, 0, this.radius
        );

        if (this.type === 'gold') {
          grad.addColorStop(0, 'rgba(255, 245, 180, 0.95)');
          grad.addColorStop(0.5, 'rgba(255, 195, 0, 0.6)');
          grad.addColorStop(1, 'rgba(215, 120, 0, 0.2)');
        } else {
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
          grad.addColorStop(0.6, 'rgba(0, 240, 255, 0.18)');
          grad.addColorStop(1, 'rgba(168, 85, 247, 0.05)');
        }

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = this.type === 'gold' ? '#ffd700' : 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-this.radius * 0.35, -this.radius * 0.35, this.radius * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.fill();

        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 7;
        this.vy = (Math.random() - 0.5) * 7;
        this.radius = Math.random() * 3.5 + 1.5;
        this.color = color;
        this.alpha = 1;
        this.decay = 0.04 + Math.random() * 0.02;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    function initStream() {
      bubbles = [];
      const bubbleCount = Math.floor((canvas.width * canvas.height) / 9000);
      for (let i = 0; i < Math.max(25, bubbleCount); i++) {
        bubbles.push(new FallingBubble());
      }
    }

    function spawnPopParticles(x, y, isGold) {
      const color = isGold ? '#ffd700' : '#00f0ff';
      for (let i = 0; i < 12; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    // --- INTERACTION & DRAG/SWIPE POINTER ENGINE ---
    function handlePointer(x, y) {
      bubbles.forEach(b => {
        const dist = Math.hypot(x - b.x, y - b.y);
        if (dist < b.radius) {
          popBubble(b);
        }
      });
    }

    canvas.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      const rect = canvas.getBoundingClientRect();
      lastPointerPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      handlePointer(lastPointerPos.x, lastPointerPos.y);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const rect = canvas.getBoundingClientRect();
      const currX = e.clientX - rect.left;
      const currY = e.clientY - rect.top;

      const steps = 5;
      for (let i = 0; i <= steps; i++) {
        const ix = lastPointerPos.x + (currX - lastPointerPos.x) * (i / steps);
        const iy = lastPointerPos.y + (currY - lastPointerPos.y) * (i / steps);
        handlePointer(ix, iy);
      }
      lastPointerPos = { x: currX, y: currY };
    });

    window.addEventListener('pointerup', () => { isPointerDown = false; });

    function popBubble(bubble) {
      const isGold = bubble.type === 'gold';
      spawnPopParticles(bubble.x, bubble.y, isGold);
      bubble.reset(false);

      const popValue = isGold ? 5 : 1;
      totalPopped += popValue;
      poppedDisplay.textContent = totalPopped;

      comboCount++;
      if (comboTimer) clearTimeout(comboTimer);
      comboTimer = setTimeout(() => {
        comboCount = 0;
        comboBadge.classList.remove('active');
      }, 800);

      if (comboCount > 3) {
        comboBadge.textContent = `${comboCount}x COMBO SPREE!`;
        comboBadge.classList.add('active');
      }

      if (isGold) {
        audio.playGoldPop();
      } else {
        audio.playPop(comboCount);
      }

      evolveCreature(isGold);
      updateProgress();
    }

    function updateProgress() {
      const percent = Math.min(100, (totalPopped / mintTarget) * 100);
      progressFill.style.width = `${percent}%`;
      targetText.textContent = `${Math.min(mintTarget, totalPopped)} / ${mintTarget}`;

      if (totalPopped >= mintTarget && !winModal.classList.contains('visible')) {
        triggerWin();
      }
    }

    // --- PROCEDURAL CHARACTER GENERATION SYSTEM (10,000+ Permutations) ---
    function evolveCreature(isGold) {
      creatureDNA.hue = (creatureDNA.hue + (isGold ? 40 : 6)) % 360;
      creatureDNA.secondaryHue = (creatureDNA.hue + 120) % 360;

      const progressRatio = totalPopped / mintTarget;

      // 10% Progress: Body Shape Assignment
      if (progressRatio > 0.10 && creatureDNA.bodyShape === 'circle') {
        const shapes = ['circle', 'rect', 'blob', 'oval', 'star'];
        creatureDNA.bodyShape = shapes[Math.floor(Math.random() * shapes.length)];
        logTrait(`Body Type: ${creatureDNA.bodyShape.toUpperCase()}`);
      }

      // 25% Progress: Ears / Horns Attachment
      if (progressRatio > 0.25 && creatureDNA.ears === 'none') {
        const earTypes = ['bunny', 'cat', 'pointed', 'horns'];
        creatureDNA.ears = earTypes[Math.floor(Math.random() * earTypes.length)];
        logTrait(`Ears: ${creatureDNA.ears.toUpperCase()}`);
      }

      // 40% Progress: Eye Configuration & Style
      if (progressRatio > 0.40 && creatureDNA.eyes === 0) {
        const styles = ['classic', 'cyclops', 'anime', 'alien', 'cute'];
        creatureDNA.eyeStyle = styles[Math.floor(Math.random() * styles.length)];
        creatureDNA.eyes = creatureDNA.eyeStyle === 'cyclops' ? 1 : Math.floor(Math.random() * 3) + 2;
        logTrait(`Eyes: ${creatureDNA.eyeStyle.toUpperCase()}`);
      }

      // 55% Progress: Texture Patterning
      if (progressRatio > 0.55 && creatureDNA.texturePattern === 'none') {
        const patterns = ['dots', 'stripes', 'rings'];
        creatureDNA.texturePattern = patterns[Math.floor(Math.random() * patterns.length)];
        logTrait(`Pattern: ${creatureDNA.texturePattern.toUpperCase()}`);
      }

      // 70% Progress: Limb Extraction
      if (progressRatio > 0.70 && creatureDNA.limbs === 0) {
        const limbTypes = ['tentacle', 'antenna', 'feet'];
        creatureDNA.limbType = limbTypes[Math.floor(Math.random() * limbTypes.length)];
        creatureDNA.limbs = Math.floor(Math.random() * 3) * 2 + 2;
        logTrait(`Limbs: ${creatureDNA.limbType.toUpperCase()}`);
      }

      // 85% Progress: Mouth Expression
      if (progressRatio > 0.85 && creatureDNA.mouth === 'none') {
        const mouths = ['smile', 'fang', 'surprised', 'cute'];
        creatureDNA.mouth = mouths[Math.floor(Math.random() * mouths.length)];
        logTrait(`Mouth: ${creatureDNA.mouth.toUpperCase()}`);
      }

      // 95% Progress: Energy Aura
      if (progressRatio > 0.95 && !creatureDNA.aura) {
        creatureDNA.aura = true;
        logTrait('Aura Field Engaged');
      }

      if (isGold && !creatureDNA.crown) {
        creatureDNA.crown = true;
        logTrait('GOLD CORE EMBEDDED');
      }

      renderCreatureSVG();
    }

    function logTrait(trait) {
      const item = document.createElement('div');
      item.className = 'dna-item';
      item.innerHTML = `<span>Pop #${totalPopped}</span><span style="color:var(--accent)">${trait}</span>`;
      dnaLog.prepend(item);
    }

    function renderCreatureSVG() {
      const primaryColor = `hsl(${creatureDNA.hue}, 85%, 60%)`;
      const secondaryColor = `hsl(${creatureDNA.secondaryHue}, 80%, 45%)`;
      let svgContent = '';

      // Layer 1: Aura
      if (creatureDNA.aura) {
        svgContent += `<circle cx="100" cy="100" r="78" fill="none" stroke="${primaryColor}" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />`;
      }

      // Layer 2: Ears / Horns
      if (creatureDNA.ears === 'bunny') {
        svgContent += `<path d="M 75 60 Q 60 10 75 10 Q 90 10 85 60 Z" fill="${secondaryColor}" />`;
        svgContent += `<path d="M 125 60 Q 110 10 125 10 Q 140 10 115 60 Z" fill="${secondaryColor}" />`;
      } else if (creatureDNA.ears === 'cat') {
        svgContent += `<polygon points="60,70 70,30 90,65" fill="${secondaryColor}" />`;
        svgContent += `<polygon points="140,70 130,30 110,65" fill="${secondaryColor}" />`;
      } else if (creatureDNA.ears === 'horns') {
        svgContent += `<path d="M 65 65 Q 40 30 55 25 Q 70 30 75 60 Z" fill="#ffd700" />`;
        svgContent += `<path d="M 135 65 Q 160 30 145 25 Q 130 30 125 60 Z" fill="#ffd700" />`;
      }

      // Layer 3: Limbs
      if (creatureDNA.limbs > 0) {
        for (let i = 0; i < creatureDNA.limbs; i++) {
          const angle = (i / creatureDNA.limbs) * Math.PI + Math.PI * 0.15;
          const lx = 100 + Math.cos(angle) * 62;
          const ly = 100 + Math.sin(angle) * 62;

          if (creatureDNA.limbType === 'tentacle') {
            svgContent += `<path d="M 100 100 Q ${100 + Math.cos(angle)*30} ${100 + Math.sin(angle)*30} ${lx} ${ly}" stroke="${secondaryColor}" stroke-width="8" stroke-linecap="round" fill="none"/>`;
          } else if (creatureDNA.limbType === 'antenna') {
            svgContent += `<line x1="100" y1="100" x2="${lx}" y2="${ly}" stroke="${primaryColor}" stroke-width="4"/>`;
            svgContent += `<circle cx="${lx}" cy="${ly}" r="6" fill="#ffd700"/>`;
          } else {
            svgContent += `<line x1="100" y1="100" x2="${lx}" y2="${ly}" stroke="${secondaryColor}" stroke-width="10" stroke-linecap="round"/>`;
          }
        }
      }

      // Layer 4: Base Body
      if (creatureDNA.bodyShape === 'rect') {
        svgContent += `<rect x="52" y="52" width="96" height="96" rx="20" fill="${primaryColor}" />`;
      } else if (creatureDNA.bodyShape === 'blob') {
        svgContent += `<path d="M 100,45 C 155,40 165,85 155,135 C 135,165 65,160 45,125 C 25,85 45,45 100,45 Z" fill="${primaryColor}" />`;
      } else if (creatureDNA.bodyShape === 'oval') {
        svgContent += `<ellipse cx="100" cy="100" rx="58" ry="42" fill="${primaryColor}" />`;
      } else if (creatureDNA.bodyShape === 'star') {
        svgContent += `<polygon points="100,40 115,75 150,75 120,98 132,135 100,112 68,135 80,98 50,75 85,75" fill="${primaryColor}" />`;
      } else {
        svgContent += `<circle cx="100" cy="100" r="48" fill="${primaryColor}" />`;
      }

      // Layer 5: Body Texture Overlay
      if (creatureDNA.texturePattern === 'dots') {
        svgContent += `<circle cx="85" cy="85" r="4" fill="${secondaryColor}" opacity="0.6"/>`;
        svgContent += `<circle cx="115" cy="115" r="6" fill="${secondaryColor}" opacity="0.6"/>`;
        svgContent += `<circle cx="90" cy="120" r="3" fill="${secondaryColor}" opacity="0.6"/>`;
      } else if (creatureDNA.texturePattern === 'stripes') {
        svgContent += `<line x1="70" y1="80" x2="130" y2="80" stroke="${secondaryColor}" stroke-width="4" opacity="0.5"/>`;
        svgContent += `<line x1="65" y1="110" x2="135" y2="110" stroke="${secondaryColor}" stroke-width="4" opacity="0.5"/>`;
      }

      // Layer 6: Crown
      if (creatureDNA.crown) {
        svgContent += `<polygon points="75,50 87,30 100,45 113,30 125,50" fill="#ffd700" />`;
      }

      // Layer 7: Eyes
      if (creatureDNA.eyes > 0) {
        if (creatureDNA.eyeStyle === 'cyclops') {
          svgContent += `<circle cx="100" cy="90" r="14" fill="#fff"/><circle cx="100" cy="90" r="6" fill="#000"/><circle cx="103" cy="87" r="2" fill="#fff"/>`;
        } else if (creatureDNA.eyeStyle === 'anime') {
          svgContent += `
            <ellipse cx="85" cy="92" rx="8" ry="12" fill="#fff"/><ellipse cx="85" cy="92" rx="4" ry="7" fill="#00f0ff"/>
            <ellipse cx="115" cy="92" rx="8" ry="12" fill="#fff"/><ellipse cx="115" cy="92" rx="4" ry="7" fill="#00f0ff"/>
          `;
        } else if (creatureDNA.eyeStyle === 'alien') {
          svgContent += `
            <polygon points="75,85 92,92 80,102" fill="#000"/>
            <polygon points="125,85 108,92 120,102" fill="#000"/>
          `;
        } else {
          svgContent += `
            <circle cx="85" cy="92" r="8" fill="#fff"/><circle cx="85" cy="92" r="3" fill="#000"/>
            <circle cx="115" cy="92" r="8" fill="#fff"/><circle cx="115" cy="92" r="3" fill="#000"/>
          `;
        }
      }

      // Layer 8: Mouth
      if (creatureDNA.mouth === 'smile') {
        svgContent += `<path d="M 88 112 Q 100 124 112 112" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      } else if (creatureDNA.mouth === 'fang') {
        svgContent += `<path d="M 88 110 L 112 110 L 100 120 Z" fill="#fff" stroke="#000" stroke-width="2"/>`;
      } else if (creatureDNA.mouth === 'surprised') {
        svgContent += `<circle cx="100" cy="114" r="5" fill="#000"/>`;
      } else if (creatureDNA.mouth === 'cute') {
        svgContent += `<path d="M 90 112 Q 95 118 100 112 Q 105 118 110 112" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
      }

      creatureSvg.innerHTML = svgContent;
    }

    function triggerWin() {
      const target = document.getElementById('winPreview');
      target.innerHTML = '';
      const clone = creatureSvg.cloneNode(true);
      clone.style.width = '160px';
      clone.style.height = '160px';
      target.appendChild(clone);
      winModal.classList.add('visible');
    }

    function resetStream() {
      winModal.classList.remove('visible');
      totalPopped = 0;
      
      // Calculate new random target threshold (60 - 150)
      mintTarget = Math.floor(Math.random() * (150 - 60 + 1)) + 60;
      poppedDisplay.textContent = '0';
      
      // Reset DNA state
      creatureDNA = {
        hue: Math.floor(Math.random() * 360),
        secondaryHue: 240,
        bodyShape: 'circle',
        texturePattern: 'none',
        eyes: 0,
        eyeStyle: 'classic',
        limbs: 0,
        limbType: 'tentacle',
        ears: 'none',
        mouth: 'none',
        aura: false,
        crown: false
      };

      dnaLog.innerHTML = `<div class="dna-item"><span>Stream Status</span><span style="color: var(--accent);">Target: ${mintTarget} Pops</span></div>`;
      updateProgress();
      renderCreatureSVG();
    }

    // Render loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      bubbles.forEach(b => {
        b.update();
        b.draw();
      });

      particles.forEach((p, idx) => {
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(idx, 1);
      });

      requestAnimationFrame(animate);
    }

    // Init Engine
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    initStream();
    resetStream();
    animate();
  </script>
</body>
</html>
