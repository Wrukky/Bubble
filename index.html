<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>THE COLONY — Incubator & Multi-Archetype Mint</title>
  <style>
    :root {
      --bg: #05070c;
      --card-bg: rgba(15, 20, 32, 0.85);
      --accent: #00f0ff;
      --gold: #ffd700;
      --pink: #ff007f;
      --purple: #a855f7;
      --red: #ff3333;
      --steel: #94a3b8;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      z-index: 10;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      background: rgba(5, 7, 12, 0.6);
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-bar {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.05em;
    }

    .stat-val {
      font-weight: 800;
      font-family: monospace;
      font-size: 1.1rem;
    }

    .gold-text {
      color: var(--gold);
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    main {
      z-index: 1;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 1rem;
      padding: 1rem;
      height: calc(100vh - 70px);
    }

    @media (max-width: 850px) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
      .sidebar {
        height: 240px;
      }
    }

    .field-container {
      position: relative;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
    }

    canvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    .stream-overlay {
      position: absolute;
      top: 1rem;
      left: 1rem;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .combo-badge {
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--pink);
      text-shadow: 0 0 8px var(--pink);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .combo-badge.active {
      opacity: 1;
    }

    .overcharge-badge {
      background: linear-gradient(90deg, var(--gold), var(--pink));
      color: #000;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      letter-spacing: 0.1em;
      display: none;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); box-shadow: 0 0 5px var(--gold); }
      to { transform: scale(1.05); box-shadow: 0 0 15px var(--pink); }
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .incubator-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      position: relative;
    }

    .progress-box {
      width: 100%;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--purple), var(--gold));
      box-shadow: 0 0 12px var(--accent);
      transition: width 0.15s ease-out;
    }

    .creature-viewport {
      width: 210px;
      height: 210px;
      position: relative;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.06) 0%, transparent 75%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
    }

    .creature-viewport.flash {
      animation: arcFlash 0.3s ease-out;
    }

    @keyframes arcFlash {
      0% { border-color: var(--gold); box-shadow: 0 0 40px var(--gold); }
      100% { border-color: rgba(0, 240, 255, 0.2); box-shadow: 0 0 30px rgba(0, 240, 255, 0.1); }
    }

    .creature-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .creature-svg.snap {
      transform: scale(1.15);
    }

    .dna-log {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 110px;
      overflow-y: auto;
    }

    .dna-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      padding: 0.35rem 0.5rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      border-left: 3px solid var(--accent);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(20px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 2rem;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.95);
      perspective: 1000px;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 0.2rem;
    }

    .modal-subtitle {
      color: #94a3b8;
      font-size: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .card-container {
      perspective: 1000px;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: center;
    }

    .holo-card {
      width: 220px;
      height: 310px;
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1rem;
    }

    .holo-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 0, 127, 0.3) 40%,
        rgba(0, 240, 255, 0.3) 60%,
        transparent 80%
      );
      opacity: 0.6;
      pointer-events: none;
      mix-blend-mode: color-dodge;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .card-svg-container {
      width: 140px;
      height: 140px;
    }

    .rarity-pills {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .rarity-tag {
      font-size: 0.58rem;
      font-weight: 800;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--accent);
      color: #fff;
      text-transform: uppercase;
    }

    .rarity-tag.gold {
      background: rgba(255, 215, 0, 0.25);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }

    .rarity-tag.demon {
      background: rgba(255, 51, 51, 0.25);
      border-color: var(--red);
      color: var(--red);
    }

    .rarity-tag.robot {
      background: rgba(148, 163, 184, 0.25);
      border-color: var(--steel);
      color: var(--steel);
    }

    .rarity-tag.vampire {
      background: rgba(168, 85, 247, 0.25);
      border-color: var(--purple);
      color: var(--purple);
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .btn {
      width: 100%;
      padding: 0.85rem 1.25rem;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #ffaa00);
      color: #000;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
    }

    .btn-overcharge {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
    }

    .btn-overcharge:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.7);
    }

    .btn-secondary {
      background: transparent;
      color: #64748b;
    }

    .btn-secondary:hover { color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-title">The Colony</div>
    </div>
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Cores Left</span>
        <span class="stat-val gold-text" id="cores-count">1,842</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Popped</span>
        <span class="stat-val" id="popped-count">0</span>
      </div>
    </div>
  </header>

  <main>
    <div class="field-container">
      <div class="stream-overlay">
        <div class="combo-badge" id="comboBadge">5x COMBO SPREE!</div>
        <div class="overcharge-badge" id="overchargeBadge">⚡ OVERCHARGING ACTIVE (+30 TARGET)</div>
      </div>
      <canvas id="fieldCanvas"></canvas>
    </div>

    <div class="sidebar">
      <div class="incubator-card">
        <div class="progress-box">
          <div class="progress-header">
            <span>Mint Target Synthesis</span>
            <span id="targetText">0 / 0</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <div class="creature-viewport" id="viewportChamber">
          <svg class="creature-svg" id="creatureSvg" viewBox="0 0 200 200"></svg>
        </div>

        <div class="dna-log" id="dnaLog">
          <div class="dna-item">
            <span>Stream Status</span>
            <span style="color: var(--accent);">Active Flow</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- MINT MODAL -->
  <div class="modal-overlay" id="winModal">
    <div class="modal-box">
      <div class="modal-title gold-text" id="modalTitle">CREATURE READY!</div>
      <div class="modal-subtitle" id="modalSubtitle">Target pops reached. Your custom specimen has fully formed.</div>
      
      <div class="card-container">
        <div class="holo-card" id="holoCard">
          <div class="card-title" id="cardSpecimenId">COLONY #1842</div>
          <div class="card-svg-container" id="cardSvgPreview"></div>
          <div class="rarity-pills" id="rarityPills"></div>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" onclick="alert('Mint Contract Triggered!')">MINT NOW (LIVE)</button>
        <button class="btn btn-overcharge" id="overchargeBtn" onclick="triggerOvercharge()">⚡ OVERCHARGE (+30 POPS FOR RARE MUTATION)</button>
        <button class="btn btn-secondary" onclick="resetStream()">Continue Streaming</button>
      </div>
    </div>
  </div>

  <script>
    class SoundEngine {
      constructor() { this.ctx = null; }

      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }

      playPop(combo = 1) {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        const pitch = Math.min(1200, 280 + (combo * 35) + Math.random() * 40);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.07);

        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.07);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.07);
      }

      playGoldPop() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();

        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          setTimeout(() => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.3);
          }, i * 40);
        });
      }
    }

    const audio = new SoundEngine();

    // --- GAME ENGINE STATE ---
    let mintTarget = Math.floor(Math.random() * (150 - 60 + 1)) + 60;
    let totalPopped = 0;
    let comboCount = 0;
    let comboTimer = null;
    let isOvercharged = false;

    // Trait DNA State
    let creatureDNA = {
      hue: 180,
      secondaryHue: 240,
      bodyShape: 'circle', // circle, rect, blob, oval, star
      texturePattern: 'none', // dots, stripes, circuit, demon-scales
      eyes: 0,
      eyeStyle: 'classic', // classic, cyclops, anime, robot-visor, cyborg-eye, demon-eyes, vampire-red
      limbs: 0,
      limbType: 'tentacle', // tentacle, antenna, feet, robot-arm, demon-wings
      ears: 'none', // bunny, cat, pointed, demon-horns, bat-ears, antenna-ears
      mouth: 'none', // smile, fangs-vampire, demon-smile, robot-grille, surprised
      aura: false,
      crown: false, // RARE: 2% Roll
      cyborgPlate: false, // RARE
      mutatedGlow: false
    };

    const canvas = document.getElementById('fieldCanvas');
    const ctx = canvas.getContext('2d');
    const poppedDisplay = document.getElementById('popped-count');
    const progressFill = document.getElementById('progressFill');
    const targetText = document.getElementById('targetText');
    const comboBadge = document.getElementById('comboBadge');
    const overchargeBadge = document.getElementById('overchargeBadge');
    const dnaLog = document.getElementById('dnaLog');
    const creatureSvg = document.getElementById('creatureSvg');
    const viewportChamber = document.getElementById('viewportChamber');
    const winModal = document.getElementById('winModal');
    const overchargeBtn = document.getElementById('overchargeBtn');

    let bubbles = [];
    let particles = [];
    let arcs = [];
    let isPointerDown = false;
    let lastPointerPos = { x: 0, y: 0 };

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }

    class FallingBubble {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.radius = Math.random() * 18 + 18;
        this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
        this.y = initial ? Math.random() * canvas.height : -this.radius * 2;
        this.speedY = Math.random() * 2.5 + 1.5;
        this.driftFreq = Math.random() * 0.03 + 0.01;
        this.driftAmp = Math.random() * 1.5 + 0.5;
        this.type = Math.random() < 0.06 ? 'gold' : 'standard';
        if (this.type === 'gold') this.speedY *= 1.4;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * this.driftFreq) * this.driftAmp;
        if (this.y - this.radius > canvas.height) this.reset(false);
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);

        const grad = ctx.createRadialGradient(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1, 0, 0, this.radius);

        if (this.type === 'gold') {
          grad.addColorStop(0, 'rgba(255, 245, 180, 0.95)');
          grad.addColorStop(0.5, 'rgba(255, 195, 0, 0.6)');
          grad.addColorStop(1, 'rgba(215, 120, 0, 0.2)');
        } else {
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
          grad.addColorStop(0.6, 'rgba(0, 240, 255, 0.18)');
          grad.addColorStop(1, 'rgba(168, 85, 247, 0.05)');
        }

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = this.type === 'gold' ? '#ffd700' : 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-this.radius * 0.35, -this.radius * 0.35, this.radius * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.fill();

        ctx.restore();
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 7;
        this.vy = (Math.random() - 0.5) * 7;
        this.radius = Math.random() * 3.5 + 1.5;
        this.color = color;
        this.alpha = 1;
        this.decay = 0.04 + Math.random() * 0.02;
      }
      update() { this.x += this.vx; this.y += this.vy; this.alpha -= this.decay; }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    class Arc {
      constructor(startX, startY, isGold) {
        this.startX = startX;
        this.startY = startY;
        this.isGold = isGold;
        this.life = 1.0;
        const rect = viewportChamber.getBoundingClientRect();
        const canvasRect = canvas.getBoundingClientRect();
        this.targetX = rect.left - canvasRect.left + rect.width / 2;
        this.targetY = rect.top - canvasRect.top + rect.height / 2;
      }

      update() { this.life -= 0.1; }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.beginPath();
        ctx.moveTo(this.startX, this.startY);

        const midX = (this.startX + this.targetX) / 2 + (Math.random() - 0.5) * 60;
        const midY = (this.startY + this.targetY) / 2 + (Math.random() - 0.5) * 60;

        ctx.quadraticCurveTo(midX, midY, this.targetX, this.targetY);
        ctx.strokeStyle = this.isGold ? '#ffd700' : '#00f0ff';
        ctx.lineWidth = this.isGold ? 3 : 2;
        ctx.shadowColor = this.isGold ? '#ffd700' : '#00f0ff';
        ctx.shadowBlur = 10;
        ctx.stroke();
        ctx.restore();
      }
    }

    function initStream() {
      bubbles = [];
      const count = Math.floor((canvas.width * canvas.height) / 9000);
      for (let i = 0; i < Math.max(25, count); i++) bubbles.push(new FallingBubble());
    }

    function popBubble(bubble) {
      const isGold = bubble.type === 'gold';
      
      for (let i = 0; i < 10; i++) particles.push(new Particle(bubble.x, bubble.y, isGold ? '#ffd700' : '#00f0ff'));
      arcs.push(new Arc(bubble.x, bubble.y, isGold));

      viewportChamber.classList.add('flash');
      creatureSvg.classList.add('snap');
      setTimeout(() => {
        viewportChamber.classList.remove('flash');
        creatureSvg.classList.remove('snap');
      }, 150);

      bubble.reset(false);

      const popValue = isGold ? 5 : 1;
      totalPopped += popValue;
      poppedDisplay.textContent = totalPopped;

      comboCount++;
      if (comboTimer) clearTimeout(comboTimer);
      comboTimer = setTimeout(() => {
        comboCount = 0;
        comboBadge.classList.remove('active');
      }, 800);

      if (comboCount > 3) {
        comboBadge.textContent = `${comboCount}x COMBO SPREE!`;
        comboBadge.classList.add('active');
      }

      if (isGold) audio.playGoldPop(); else audio.playPop(comboCount);

      evolveCreature(isGold);
      updateProgress();
    }

    function handlePointer(x, y) {
      bubbles.forEach(b => {
        if (Math.hypot(x - b.x, y - b.y) < b.radius) popBubble(b);
      });
    }

    canvas.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      const rect = canvas.getBoundingClientRect();
      lastPointerPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      handlePointer(lastPointerPos.x, lastPointerPos.y);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const rect = canvas.getBoundingClientRect();
      const currX = e.clientX - rect.left;
      const currY = e.clientY - rect.top;

      for (let i = 0; i <= 5; i++) {
        const ix = lastPointerPos.x + (currX - lastPointerPos.x) * (i / 5);
        const iy = lastPointerPos.y + (currY - lastPointerPos.y) * (i / 5);
        handlePointer(ix, iy);
      }
      lastPointerPos = { x: currX, y: currY };
    });

    window.addEventListener('pointerup', () => { isPointerDown = false; });

    function updateProgress() {
      const percent = Math.min(100, (totalPopped / mintTarget) * 100);
      progressFill.style.width = `${percent}%`;
      targetText.textContent = `${Math.min(mintTarget, totalPopped)} / ${mintTarget}`;

      if (totalPopped >= mintTarget && !winModal.classList.contains('visible')) {
        triggerWinModal();
      }
    }

    function triggerOvercharge() {
      winModal.classList.remove('visible');
      isOvercharged = true;
      mintTarget += 30;
      overchargeBadge.style.display = 'block';
      overchargeBtn.style.display = 'none';
      logTrait('⚡ OVERCHARGE ENGAGED (+30 POPS)');
      updateProgress();
    }

    // --- PROCEDURAL CHARACTER SYSTEM (Multi-Archetype Traits) ---
    function evolveCreature(isGold) {
      creatureDNA.hue = (creatureDNA.hue + (isGold ? 40 : 6)) % 360;
      creatureDNA.secondaryHue = (creatureDNA.hue + 120) % 360;

      const progressRatio = totalPopped / mintTarget;

      // 10%: Distinct Body Shapes
      if (progressRatio > 0.10 && creatureDNA.bodyShape === 'circle') {
        const shapes = ['circle', 'rect', 'blob', 'oval', 'star'];
        creatureDNA.bodyShape = shapes[Math.floor(Math.random() * shapes.length)];
        logTrait(`Body: ${creatureDNA.bodyShape.toUpperCase()}`);
      }

      // 25%: Head Gear / Ears / Demon Horns / Bat Ears
      if (progressRatio > 0.25 && creatureDNA.ears === 'none') {
        const earTypes = ['bunny', 'cat', 'pointed', 'demon-horns', 'bat-ears', 'antenna-ears'];
        creatureDNA.ears = earTypes[Math.floor(Math.random() * earTypes.length)];
        logTrait(`Head: ${creatureDNA.ears.toUpperCase()}`);
      }

      // 40%: Expressive & Archetype Eye Styles
      if (progressRatio > 0.40 && creatureDNA.eyes === 0) {
        const styles = ['classic', 'cyclops', 'anime', 'robot-visor', 'cyborg-eye', 'demon-eyes', 'vampire-red'];
        creatureDNA.eyeStyle = styles[Math.floor(Math.random() * styles.length)];
        creatureDNA.eyes = creatureDNA.eyeStyle === 'cyclops' ? 1 : Math.floor(Math.random() * 3) + 2;
        logTrait(`Optics: ${creatureDNA.eyeStyle.toUpperCase()}`);
      }

      // 55%: Texture Patterns & Circuitry
      if (progressRatio > 0.55 && creatureDNA.texturePattern === 'none') {
        const patterns = ['dots', 'stripes', 'circuit', 'demon-scales'];
        creatureDNA.texturePattern = patterns[Math.floor(Math.random() * patterns.length)];
        logTrait(`Pattern: ${creatureDNA.texturePattern.toUpperCase()}`);
      }

      // 70%: Limb Attachments & Wings
      if (progressRatio > 0.70 && creatureDNA.limbs === 0) {
        const limbTypes = ['tentacle', 'antenna', 'feet', 'robot-arm', 'demon-wings'];
        creatureDNA.limbType = limbTypes[Math.floor(Math.random() * limbTypes.length)];
        creatureDNA.limbs = creatureDNA.limbType === 'demon-wings' ? 2 : Math.floor(Math.random() * 3) * 2 + 2;
        logTrait(`Appendages: ${creatureDNA.limbType.toUpperCase()}`);
      }

      // 85%: Mouth Expression & Fangs
      if (progressRatio > 0.85 && creatureDNA.mouth === 'none') {
        const mouths = ['smile', 'fangs-vampire', 'demon-smile', 'robot-grille', 'surprised'];
        creatureDNA.mouth = mouths[Math.floor(Math.random() * mouths.length)];
        logTrait(`Mouth: ${creatureDNA.mouth.toUpperCase()}`);
      }

      // 95%: Aura Field
      if (progressRatio > 0.95 && !creatureDNA.aura) {
        creatureDNA.aura = true;
        logTrait('Aura Field Engaged');
      }

      // Rare Trait Rolls (2% chance on Gold Pops or Overcharge)
      if (isGold || isOvercharged) {
        if (!creatureDNA.crown && Math.random() < 0.02) {
          creatureDNA.crown = true;
          logTrait('👑 RARE GOLD CROWN UNLOCKED!');
        }
        if (!creatureDNA.cyborgPlate && Math.random() < 0.03) {
          creatureDNA.cyborgPlate = true;
          logTrait('⚙️ RARE CYBORG IMPLANT ATTACHED!');
        }
      }

      if (isOvercharged && progressRatio >= 1.0 && !creatureDNA.mutatedGlow) {
        creatureDNA.mutatedGlow = true;
        logTrait('⚡ OVERCHARGED MUTATION!');
      }

      renderCreatureSVG();
    }

    function logTrait(trait) {
      const item = document.createElement('div');
      item.className = 'dna-item';
      item.innerHTML = `<span>Pop #${totalPopped}</span><span style="color:var(--accent)">${trait}</span>`;
      dnaLog.prepend(item);
    }

    function renderCreatureSVG() {
      const primaryColor = `hsl(${creatureDNA.hue}, 85%, 60%)`;
      const secondaryColor = `hsl(${creatureDNA.secondaryHue}, 80%, 45%)`;
      let svgContent = '';

      if (creatureDNA.mutatedGlow) {
        svgContent += `<circle cx="100" cy="100" r="90" fill="none" stroke="#ff007f" stroke-width="6" opacity="0.6" />`;
      }

      if (creatureDNA.aura) {
        svgContent += `<circle cx="100" cy="100" r="78" fill="none" stroke="${primaryColor}" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />`;
      }

      // Head / Horns / Ears
      if (creatureDNA.ears === 'bunny') {
        svgContent += `<path d="M 75 60 Q 60 10 75 10 Q 90 10 85 60 Z" fill="${secondaryColor}" />`;
        svgContent += `<path d="M 125 60 Q 110 10 125 10 Q 140 10 115 60 Z" fill="${secondaryColor}" />`;
      } else if (creatureDNA.ears === 'cat') {
        svgContent += `<polygon points="60,70 70,30 90,65" fill="${secondaryColor}" />`;
        svgContent += `<polygon points="140,70 130,30 110,65" fill="${secondaryColor}" />`;
      } else if (creatureDNA.ears === 'demon-horns') {
        svgContent += `<path d="M 65 65 Q 30 10 50 15 Q 65 25 75 60 Z" fill="#ff3333" stroke="#900" stroke-width="2" />`;
        svgContent += `<path d="M 135 65 Q 170 10 150 15 Q 135 25 125 60 Z" fill="#ff3333" stroke="#900" stroke-width="2" />`;
      } else if (creatureDNA.ears === 'bat-ears') {
        svgContent += `<path d="M 65 70 Q 30 40 45 20 Q 75 40 75 65 Z" fill="${secondaryColor}" />`;
        svgContent += `<path d="M 135 70 Q 170 40 155 20 Q 125 40 125 65 Z" fill="${secondaryColor}" />`;
      } else if (creatureDNA.ears === 'antenna-ears') {
        svgContent += `<line x1="75" y1="65" x2="55" y2="25" stroke="${primaryColor}" stroke-width="4"/>`;
        svgContent += `<circle cx="55" cy="25" r="5" fill="#00f0ff"/>`;
        svgContent += `<line x1="125" y1="65" x2="145" y2="25" stroke="${primaryColor}" stroke-width="4"/>`;
        svgContent += `<circle cx="145" cy="25" r="5" fill="#00f0ff"/>`;
      }

      // Limbs / Demon Wings
      if (creatureDNA.limbs > 0) {
        if (creatureDNA.limbType === 'demon-wings') {
          svgContent += `<path d="M 50 100 Q 10 50 20 120 Q 45 110 55 105 Z" fill="#ff3333" opacity="0.85"/>`;
          svgContent += `<path d="M 150 100 Q 190 50 180 120 Q 155 110 145 105 Z" fill="#ff3333" opacity="0.85"/>`;
        } else {
          for (let i = 0; i < creatureDNA.limbs; i++) {
            const angle = (i / creatureDNA.limbs) * Math.PI + Math.PI * 0.15;
            const lx = 100 + Math.cos(angle) * 62;
            const ly = 100 + Math.sin(angle) * 62;

            if (creatureDNA.limbType === 'tentacle') {
              svgContent += `<path d="M 100 100 Q ${100 + Math.cos(angle)*30} ${100 + Math.sin(angle)*30} ${lx} ${ly}" stroke="${secondaryColor}" stroke-width="8" stroke-linecap="round" fill="none"/>`;
            } else if (creatureDNA.limbType === 'robot-arm') {
              svgContent += `<line x1="100" y1="100" x2="${lx}" y2="${ly}" stroke="#94a3b8" stroke-width="8" stroke-linecap="square"/>`;
              svgContent += `<circle cx="${lx}" cy="${ly}" r="6" fill="#00f0ff"/>`;
            } else {
              svgContent += `<line x1="100" y1="100" x2="${lx}" y2="${ly}" stroke="${secondaryColor}" stroke-width="10" stroke-linecap="round"/>`;
            }
          }
        }
      }

      // Base Body Shapes
      if (creatureDNA.bodyShape === 'rect') {
        svgContent += `<rect x="52" y="52" width="96" height="96" rx="20" fill="${primaryColor}" />`;
      } else if (creatureDNA.bodyShape === 'blob') {
        svgContent += `<path d="M 100,45 C 155,40 165,85 155,135 C 135,165 65,160 45,125 C 25,85 45,45 100,45 Z" fill="${primaryColor}" />`;
      } else if (creatureDNA.bodyShape === 'oval') {
        svgContent += `<ellipse cx="100" cy="100" rx="58" ry="42" fill="${primaryColor}" />`;
      } else if (creatureDNA.bodyShape === 'star') {
        svgContent += `<polygon points="100,40 115,75 150,75 120,98 132,135 100,112 68,135 80,98 50,75 85,75" fill="${primaryColor}" />`;
      } else {
        svgContent += `<circle cx="100" cy="100" r="48" fill="${primaryColor}" />`;
      }

      // Cyborg Metal Plate (Rare)
      if (creatureDNA.cyborgPlate) {
        svgContent += `<path d="M 80 55 L 140 55 L 125 125 L 80 90 Z" fill="#64748b" opacity="0.8" stroke="#94a3b8" stroke-width="2"/>`;
        svgContent += `<circle cx="115" cy="75" r="3" fill="#ff007f"/>`;
      }

      // Body Textures
      if (creatureDNA.texturePattern === 'dots') {
        svgContent += `<circle cx="85" cy="85" r="4" fill="${secondaryColor}" opacity="0.6"/>`;
        svgContent += `<circle cx="115" cy="115" r="6" fill="${secondaryColor}" opacity="0.6"/>`;
      } else if (creatureDNA.texturePattern === 'stripes') {
        svgContent += `<line x1="70" y1="80" x2="130" y2="80" stroke="${secondaryColor}" stroke-width="4" opacity="0.5"/>`;
        svgContent += `<line x1="65" y1="110" x2="135" y2="110" stroke="${secondaryColor}" stroke-width="4" opacity="0.5"/>`;
      } else if (creatureDNA.texturePattern === 'circuit') {
        svgContent += `<path d="M 70 80 H 90 V 110 H 120" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8"/>`;
      }

      // Rare Gold Crown
      if (creatureDNA.crown) {
        svgContent += `<polygon points="75,48 87,25 100,42 113,25 125,48" fill="#ffd700" stroke="#b8860b" stroke-width="1.5" />`;
        svgContent += `<circle cx="100" cy="38" r="3" fill="#ff007f"/>`;
      }

      // Eye Styles
      if (creatureDNA.eyes > 0) {
        if (creatureDNA.eyeStyle === 'cyclops') {
          svgContent += `<circle cx="100" cy="90" r="14" fill="#fff"/><circle cx="100" cy="90" r="6" fill="#000"/><circle cx="103" cy="87" r="2" fill="#fff"/>`;
        } else if (creatureDNA.eyeStyle === 'robot-visor') {
          svgContent += `<rect x="68" y="82" width="64" height="18" rx="6" fill="#0b0f19" stroke="#00f0ff" stroke-width="2"/>`;
          svgContent += `<line x1="72" y1="91" x2="128" y2="91" stroke="#ff007f" stroke-width="3"/>`;
        } else if (creatureDNA.eyeStyle === 'cyborg-eye') {
          svgContent += `<circle cx="85" cy="92" r="8" fill="#fff"/><circle cx="85" cy="92" r="3" fill="#000"/>`;
          svgContent += `<circle cx="115" cy="92" r="10" fill="#000" stroke="#ff0055" stroke-width="2"/><circle cx="115" cy="92" r="4" fill="#ff0055"/>`;
        } else if (creatureDNA.eyeStyle === 'demon-eyes') {
          svgContent += `<ellipse cx="85" cy="92" rx="9" ry="12" fill="#ff3333"/><line x1="85" y1="82" x2="85" y2="102" stroke="#000" stroke-width="3"/>`;
          svgContent += `<ellipse cx="115" cy="92" rx="9" ry="12" fill="#ff3333"/><line x1="115" y1="82" x2="115" y2="102" stroke="#000" stroke-width="3"/>`;
        } else if (creatureDNA.eyeStyle === 'vampire-red') {
          svgContent += `<circle cx="85" cy="92" r="8" fill="#000"/><circle cx="85" cy="92" r="3" fill="#ff0033"/>`;
          svgContent += `<circle cx="115" cy="92" r="8" fill="#000"/><circle cx="115" cy="92" r="3" fill="#ff0033"/>`;
        } else {
          svgContent += `<circle cx="85" cy="92" r="8" fill="#fff"/><circle cx="85" cy="92" r="3" fill="#000"/><circle cx="115" cy="92" r="8" fill="#fff"/><circle cx="115" cy="92" r="3" fill="#000"/>`;
        }
      }

      // Mouth Styles
      if (creatureDNA.mouth === 'smile') {
        svgContent += `<path d="M 88 112 Q 100 124 112 112" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      } else if (creatureDNA.mouth === 'fangs-vampire') {
        svgContent += `<path d="M 88 110 L 112 110 M 92 110 L 92 118 M 108 110 L 108 118" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
      } else if (creatureDNA.mouth === 'demon-smile') {
        svgContent += `<path d="M 85 110 Q 100 128 115 110 Z" fill="#ff3333" stroke="#000" stroke-width="2"/>`;
      } else if (creatureDNA.mouth === 'robot-grille') {
        svgContent += `<rect x="85" y="110" width="30" height="10" fill="#0b0f19" stroke="#94a3b8" stroke-width="1.5"/>`;
        svgContent += `<line x1="93" y1="110" x2="93" y2="120" stroke="#94a3b8"/><line x1="100" y1="110" x2="100" y2="120" stroke="#94a3b8"/><line x1="107" y1="110" x2="107" y2="120" stroke="#94a3b8"/>`;
      }

      creatureSvg.innerHTML = svgContent;
    }

    const holoCard = document.getElementById('holoCard');
    holoCard.addEventListener('mousemove', (e) => {
      const rect = holoCard.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      holoCard.style.transform = `rotateY(${x / 8}deg) rotateX(${-y / 8}deg)`;
    });

    holoCard.addEventListener('mouseleave', () => {
      holoCard.style.transform = 'rotateY(0deg) rotateX(0deg)';
    });

    function triggerWinModal() {
      const target = document.getElementById('cardSvgPreview');
      target.innerHTML = '';
      const clone = creatureSvg.cloneNode(true);
      target.appendChild(clone);

      const pills = document.getElementById('rarityPills');
      pills.innerHTML = '';

      if (creatureDNA.crown) pills.innerHTML += `<span class="rarity-tag gold">👑 GOLD CROWN</span>`;
      if (creatureDNA.cyborgPlate) pills.innerHTML += `<span class="rarity-tag robot">⚙️ CYBORG PLATE</span>`;
      if (creatureDNA.ears === 'demon-horns' || creatureDNA.limbType === 'demon-wings') pills.innerHTML += `<span class="rarity-tag demon">👹 DEMON</span>`;
      if (creatureDNA.eyeStyle === 'vampire-red' || creatureDNA.mouth === 'fangs-vampire') pills.innerHTML += `<span class="rarity-tag vampire">🧛 VAMPIRE</span>`;
      if (creatureDNA.eyeStyle === 'robot-visor' || creatureDNA.mouth === 'robot-grille') pills.innerHTML += `<span class="rarity-tag robot">🤖 ROBOT</span>`;
      if (creatureDNA.mutatedGlow) pills.innerHTML += `<span class="rarity-tag" style="border-color:var(--pink)">⚡ OVERCHARGED</span>`;
      
      pills.innerHTML += `<span class="rarity-tag">${creatureDNA.bodyShape}</span>`;

      if (isOvercharged) {
        document.getElementById('modalTitle').textContent = 'MUTATED SPECIMEN READY!';
        document.getElementById('modalSubtitle').textContent = 'Overcharge target reached. Rare traits unlocked!';
      }

      winModal.classList.add('visible');
    }

    function resetStream() {
      winModal.classList.remove('visible');
      totalPopped = 0;
      isOvercharged = false;
      mintTarget = Math.floor(Math.random() * (150 - 60 + 1)) + 60;
      poppedDisplay.textContent = '0';
      overchargeBadge.style.display = 'none';
      overchargeBtn.style.display = 'block';

      creatureDNA = {
        hue: Math.floor(Math.random() * 360),
        secondaryHue: 240,
        bodyShape: 'circle',
        texturePattern: 'none',
        eyes: 0,
        eyeStyle: 'classic',
        limbs: 0,
        limbType: 'tentacle',
        ears: 'none',
        mouth: 'none',
        aura: false,
        crown: false,
        cyborgPlate: false,
        mutatedGlow: false
      };

      dnaLog.innerHTML = `<div class="dna-item"><span>Stream Status</span><span style="color: var(--accent);">Target: ${mintTarget} Pops</span></div>`;
      updateProgress();
      renderCreatureSVG();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      bubbles.forEach(b => { b.update(); b.draw(); });
      particles.forEach((p, idx) => { p.update(); p.draw(); if (p.alpha <= 0) particles.splice(idx, 1); });
      arcs.forEach((a, idx) => { a.update(); a.draw(); if (a.life <= 0) arcs.splice(idx, 1); });

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    initStream();
    resetStream();
    animate();
  </script>
</body>
</html>
